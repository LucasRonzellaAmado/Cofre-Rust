[workspace]
resolver = "2"
members = ["crates/cofre-core", "crates/cofre-cli", "crates/cofre-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Lucas Ronzella Amado"]
repository = "https://github.com/luquinha/cofre"

[workspace.dependencies]
cofre-core = { path = "crates/cofre-core" }
cofre-server = { path = "crates/cofre-server" }
anyhow = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
axum = "0.8"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
fastcdc = "3"
filetime = "0.2"
futures = "0.3"
gethostname = "1"
globset = "0.4"
hex = "0.4"
object_store = { version = "0.12", features = ["aws"] }
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zeroize = "1"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
